aid: seltz
name: Seltz
description: >-
  Seltz is a San Francisco-based AI infrastructure company building the web
  retrieval and knowledge layer for the agentic internet. Its Web Knowledge API
  gives LLMs, RAG pipelines, and autonomous agents real-time, context-engineered
  web data through a single call: POST /v1/search returns ranked, cleaned source
  documents, POST /v1/answer returns a direct RAG answer with citations, and an
  OpenAI-compatible /v1/chat/completions endpoint serves web-grounded chat.
  Rather than returning raw snippets like a traditional search API, Seltz shapes
  web content to maximize usefulness for machine reasoning. Founded in 2025 by
  Antonio Mallia (Amazon, Pinecone) and backed by Speedinvest and B Capital,
  Seltz ships official Python and TypeScript SDKs, a hosted MCP server, and
  integrations for OpenAI, Anthropic, Mistral, LlamaIndex, Agno, Langroid, Dify,
  n8n, and Zapier.
